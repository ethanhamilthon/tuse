name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install --no-update
      - run: sh release/check-tag.sh "$GITHUB_REF_NAME"

  check:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  build:
    needs: preflight
    strategy:
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, name: darwin_arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, name: darwin_amd64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux_amd64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: linux_arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TARGET: ${{ matrix.target }}
      ASSET: tuse_${{ matrix.name }}.tar.gz
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install --no-update && rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          shared-key: release-${{ matrix.target }}
      - run: cargo build --locked --release --target "$TARGET" -p tuse
      - name: Package and smoke test
        run: |
          sh release/package.sh "$TARGET" "$ASSET"
          sh release/smoke.sh "$ASSET" "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tuse_${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [check, build]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tuse_*
          path: dist
          merge-multiple: true
      - name: Validate assets and generate checksums
        run: |
          set -eu
          cp release/main.lua dist/
          # This placeholder is needed when updating from 0.4.0 or older.
          echo '# Defaults are built into tuse.' > dist/default.yaml
          cd dist
          sha256sum tuse_darwin_amd64.tar.gz tuse_darwin_arm64.tar.gz \
            tuse_linux_amd64.tar.gz tuse_linux_arm64.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/tuse_darwin_amd64.tar.gz
            dist/tuse_darwin_arm64.tar.gz
            dist/tuse_linux_amd64.tar.gz
            dist/tuse_linux_arm64.tar.gz
            dist/checksums.txt
            dist/main.lua
            dist/default.yaml
          fail_on_unmatched_files: true
          generate_release_notes: true
