name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install --no-update
      - name: Check tag and changelog
        run: |
          set -eu
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c \
            'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "tuse"))')"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Cargo version v$version" >&2; exit 1; }
          grep -Fx "## $version" release/CHANGELOG.md >/dev/null

  check:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  build:
    needs: preflight
    strategy:
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, name: darwin_arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, name: darwin_amd64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux_amd64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: linux_arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TARGET: ${{ matrix.target }}
      ASSET: tuse_${{ matrix.name }}.tar.gz
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install --no-update && rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          shared-key: release-${{ matrix.target }}
      - run: cargo build --locked --release --target "$TARGET" -p tuse
      - name: Package
        run: |
          set -eu
          bin="${CARGO_TARGET_DIR:-target}/$TARGET/release/tuse"
          case "$TARGET" in
            aarch64-apple-darwin) format='Mach-O.*arm64' ;;
            x86_64-apple-darwin) format='Mach-O.*x86_64' ;;
            aarch64-unknown-linux-gnu) format='ELF.*ARM aarch64' ;;
            x86_64-unknown-linux-gnu) format='ELF.*x86-64' ;;
            *) echo "Unsupported target: $TARGET" >&2; exit 1 ;;
          esac
          file -b "$bin" | grep -E "$format"
          tar -C "$(dirname "$bin")" -czf "$ASSET" tuse
      - name: Smoke test
        run: |
          set -eu
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          test "$(tar -tzf "$ASSET")" = tuse
          tar -xzf "$ASSET" -C "$tmp"
          test "$("$tmp/tuse" version)" = "tuse ${GITHUB_REF_NAME#v}"
          cd "$tmp"
          export HOME="$tmp"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize"}' \
            '{"jsonrpc":"2.0","id":2,"method":"shutdown"}' > request.jsonl
          ./tuse json < request.jsonl > response.jsonl
          python3 -c 'import json, sys
          with open("response.jsonl") as f:
              init, shutdown = map(json.loads, f)
          assert init["id"] == 1 and init["result"]["tuse"] == sys.argv[1]
          assert shutdown["id"] == 2 and shutdown["result"] is None
          ' "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tuse_${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [check, build]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tuse_*
          path: dist
          merge-multiple: true
      - name: Validate assets and generate checksums
        run: |
          set -eu
          # This placeholder is needed when updating from 0.4.0 or older.
          echo '# Defaults are built into tuse.' > dist/default.yaml
          cd dist
          sha256sum tuse_darwin_amd64.tar.gz tuse_darwin_arm64.tar.gz \
            tuse_linux_amd64.tar.gz tuse_linux_arm64.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/tuse_darwin_amd64.tar.gz
            dist/tuse_darwin_arm64.tar.gz
            dist/tuse_linux_amd64.tar.gz
            dist/tuse_linux_arm64.tar.gz
            dist/checksums.txt
            dist/default.yaml
          fail_on_unmatched_files: true
          generate_release_notes: true
