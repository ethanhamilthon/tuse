[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/ethanhamilthon/tuse"

[workspace.dependencies]
tuse-config = { path = "crates/config" }
tuse-api = { path = "crates/api" }
tuse-core = { path = "crates/core" }
tuse-socket = { path = "crates/socket" }
tuse-tui = { path = "crates/tui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq = "2.12"
crossterm = "0.28"
pulldown-cmark = { version = "0.12", default-features = false }
unicode-width = "0.2"
base64 = "0.22"
arboard = "3"
png = "0.18"

[profile.release]
strip = true
lto = "thin"
