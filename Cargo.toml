[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/ethanhamilthon/tuse"

[workspace.dependencies]
tuse-config = { path = "crates/config" }
tuse-api = { path = "crates/api" }
tuse-core = { path = "crates/core" }
tuse-lua = { path = "crates/lua" }
mlua = { version = "0.12", features = ["lua54", "vendored", "serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tuse-tui = { path = "crates/tui" }
tuse-rpc = { path = "crates/rpc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"
crossterm = "0.28"
pulldown-cmark = { version = "0.12", default-features = false }
unicode-width = "0.2"
base64 = "0.22"
arboard = "3"
png = "0.18"

[profile.release]
strip = true
lto = "thin"
